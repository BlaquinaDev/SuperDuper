name: RDP

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 3600

    steps:

      #######################################
      # HABILITAR RDP + CONFIG SEGURA (COMPATIBLE CON aRDP)
      #######################################
      - name: Configure RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 1 -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" -Value 2 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale" | Out-Null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      #######################################
      # CREAR USUARIO RDP
      #######################################
      - name: Create RDP User
        run: |
          $password = "FLP4600@@"
          $secure = ConvertTo-SecureString -String$password -AsPlainText -Force

          if (Get-LocalUser -Name "Floppato" -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name "Floppato"
          }

          New-LocalUser -Name "Floppato" -Password $secure -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "Floppato"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "Floppato"

      #######################################
      # TAILSCALE
      #######################################
      - name: Install Tailscale
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $path = "$env:TEMP\ts.msi"

          Invoke-WebRequest -Uri $url -OutFile$path
          Start-Process msiexec.exe -ArgumentList "/i `"$path`" /quiet /norestart" -Wait
          Remove-Item -Path $path -Force

      - name: Connect Tailscale
        run: |
          $hostname = "runner-$env:GITHUB_RUN_ID"
          echo "TS_HOSTNAME=$hostname" >> $env:GITHUB_ENV

          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=$hostname

          for ($i = 0; $i -lt 10; $i++) {
            $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
            if ($ip) {
              echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
              Write-Host "Tailscale IP: $ip"
              exit 0
            }
            Start-Sleep -Seconds 5
          }

          Write-Error "ERROR: Tailscale IP no asignada"
          exit 1

      #######################################
      # VERIFICAR RDP Y DESACTIVAR TIMEOUTS
      #######################################
      - name: Verify RDP
        run: |
          $test = Test-NetConnection -ComputerName$env:TAILSCALE_IP -Port 3389
          if (-not $test.TcpTestSucceeded) {
            Write-Error "Puerto 3389 cerrado"
            exit 1
          }
          Write-Host "RDP OK"
          
          Set-ItemProperty `
             -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" `
              -Name "MaxIdleTime" -Value 0 -Type DWord -Force

          Set-ItemProperty `
              -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" `
              -Name "MaxDisconnectionTime" -Value 0 -Type DWord -Force

          Set-ItemProperty `
              -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" `
              -Name "MaxConnectionTime" -Value 0 -Type DWord -Force

      #######################################
      # INSTALAR DISCORD Y YT-DLP (CON MEDIDAS ANTI-ERRORES)
      #######################################
      - name: Instalar Discord y yt-dlp
        run: |
          Write-Host "=== Instalando herramientas y descargando recursos ==="
          
          winget install --id Unicodify.yt-dlp -e --silent --accept-source-agreements --accept-package-agreements
          winget install --id Gyan.FFmpeg -e --silent --accept-source-agreements --accept-package-agreements

          $discordUrl = "https://discord.com/api/downloads/distributions/app/installers/latest?channel=stable&platform=win&arch=x64"
          $discordPath = "$env:TEMP\DiscordSetup.exe"
          Invoke-WebRequest -Uri $discordUrl -OutFile$discordPath
          Write-Host "Instalador de Discord guardado en: $discordPath"

          $videoUrl = "https://youtu.be/oB-WOYBO1f4"
          $maxRetries = 5$retryCount = 0
          $success =$false

          while ($retryCount -lt $maxRetries -and -not$success) {
            try {
              Write-Host "Intentando descargar el video (Intento $($retryCount + 1))..."
              yt-dlp --format "worst" --no-check-certificates --ignore-errors --retries 10 --fragment-retries 10 --geo-bypass $videoUrl
              
              if ($LASTEXITCODE -eq 0) {
                $success =$true
                Write-Host "¡Video descargado exitosamente a la calidad más baja!"
              } else {
                throw "yt-dlp finalizó con código de error: $LASTEXITCODE"
              }
            } catch {
              $retryCount++
              Write-Warning "Ocurrió un error en la descarga: $_"
              if ($retryCount -lt$maxRetries) {
                Write-Host "Reintentando en 10 segundos..."
                Start-Sleep -Seconds 10
              } else {
                Write-Error "Se agotaron los reintentos para descargar el video."
              }
            }
          }

      #######################################
      # MANTENER RDP + DIAGNÓSTICO TOTAL
      #######################################
      - name: Maintain RDP
        run: |
          $port = (Get-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp').PortNumber
          
          Write-Host ""
          Write-Host "=================================================="
          Write-Host "               ======= RDP ACCESS ======="
          Write-Host "=================================================="
          Write-Host "IP Address (IPv4) : $env:TAILSCALE_IP"
          Write-Host "Tailscale Hostname: $env:TS_HOSTNAME"
          Write-Host "RDP Port          : $port"
          Write-Host "User              : Floppato"
          Write-Host "Password          : FLP4600@@"
          Write-Host "--------------------------------------------------"
          Write-Host "PARA aRDP (Android):"
          Write-Host " -> En 'PC Address' pon: $env:TAILSCALE_IP"
          Write-Host " -> O intenta con Hostname: $env:TS_HOSTNAME"
          Write-Host " -> Asegúrate de que la app Tailscale esté conectada en tu móvil."
          Write-Host "=================================================="
          Write-Host ""

          $limit = (Get-Date).AddHours(5).AddMinutes(40)

          while ($true) {
            if ((Get-Date) -ge $limit) {
              Write-Host "Tiempo agotado — reiniciando workflow..."

              $headers = @{
                "Accept"        = "application/vnd.github+json"
                "Authorization" = "Bearer ${{ secrets.GITHUB_TOKEN }}"
              }

              $body = @{
                ref = "main"
              } | ConvertTo-Json

              Invoke-RestMethod -Method Post `
                -Uri "https://api.github.com/repos/${env:GITHUB_REPOSITORY}/actions/workflows/RDP.yml/dispatches" `
                -Headers $headers `
                -ContentType "application/json" `
                -Body $body

              exit 0
            }

            Write-Host "[$(Get-Date)] RDP activo — esperando..."
            Start-Sleep -Seconds 300
          }
